<svg xmlns="http://www.w3.org/2000/svg" width="360" height="180" viewBox="0 0 360 180" role="img">
  <title>Millastar GitHub statistics</title>
  <desc>Current public repository totals for Millastar.</desc>
  <style>
    .frame { fill: transparent; stroke: #d0d7de; }
    .title { fill: #24292f; font: 700 18px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .label { fill: #57606a; font: 500 12px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .value { fill: #24292f; font: 700 17px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .item { opacity: 0; animation: rise .55s ease-out forwards; }
    @keyframes rise { from { opacity: 0; transform: translateY(7px); } to { opacity: 1; transform: translateY(0); } }
    @media (prefers-color-scheme: dark) { .frame { stroke: #30363d; } .title, .value { fill: #f0f6fc; } .label { fill: #8b949e; } }
    @media (prefers-reduced-motion: reduce) { .item { opacity: 1; animation: none; } }
  </style>
  <rect x="1" y="1" width="358" height="178" rx="8" class="frame"/>
  <text x="22" y="34" class="title">GitHub Statistics</text>
  <g class="item" style="animation-delay:0ms"><circle cx="31" cy="61" r="5" fill="#d29922"/><text x="46" y="66" class="label">Repository stars</text><text x="326" y="66" text-anchor="end" class="value">5</text></g>
  <g class="item" style="animation-delay:120ms"><circle cx="31" cy="88" r="5" fill="#ff7b72"/><text x="46" y="93" class="label">Repository forks</text><text x="326" y="93" text-anchor="end" class="value">1</text></g>
  <g class="item" style="animation-delay:240ms"><circle cx="31" cy="115" r="5" fill="#58a6ff"/><text x="46" y="120" class="label">Featured projects</text><text x="326" y="120" text-anchor="end" class="value">3</text></g>
  <g class="item" style="animation-delay:360ms"><circle cx="31" cy="142" r="5" fill="#a371f7"/><text x="46" y="147" class="label">Focus</text><text x="326" y="147" text-anchor="end" class="value">AI apps</text></g>
</svg>
